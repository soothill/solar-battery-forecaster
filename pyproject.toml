[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "solar-battery-forecaster"
version = "0.1.0"
description = "Self-hosted solar forecasting and overnight battery charge planner"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Darren Soothill"}]
keywords = ["solar", "battery", "influxdb", "octopus-energy", "sigenergy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<1",
  "influxdb-client>=1.48,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
solar-battery-forecaster = "solar_battery_forecaster.cli:main"
solar-battery-dashboard = "solar_battery_forecaster.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_battery_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
